# Local monorepo stack: API + UI
#
# Prerequisites:
#   export APP_AZURE_TENANT_ID=...
#   export APP_AZURE_API_CLIENT_ID=...
#   # UI SPA app registration (public client):
#   export VITE_AZURE_TENANT_ID=$APP_AZURE_TENANT_ID
#   export VITE_AZURE_CLIENT_ID=...
#   export VITE_AZURE_API_CLIENT_ID=$APP_AZURE_API_CLIENT_ID
#   export VITE_AZURE_API_SCOPE=api://$APP_AZURE_API_CLIENT_ID/access_as_user
#
# Run from repo root:
#   docker compose -f deploy/docker-compose.yml up --build

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: platform-management-service-api:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: k8s
      APP_AZURE_TENANT_ID: ${APP_AZURE_TENANT_ID}
      APP_AZURE_API_CLIENT_ID: ${APP_AZURE_API_CLIENT_ID}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-${APP_AZURE_TENANT_ID}}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_API_CLIENT_ID: ${VITE_AZURE_API_CLIENT_ID:-${APP_AZURE_API_CLIENT_ID}}
        VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE:-api://${APP_AZURE_API_CLIENT_ID}/access_as_user}
        # Browser calls API on host port 8080
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    image: platform-management-service-ui:local
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
