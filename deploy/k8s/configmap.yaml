apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-management-service-config
  namespace: platform-management
  labels:
    app.kubernetes.io/name: platform-management-service
    app.kubernetes.io/component: api
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  SERVER_PORT: "8080"
  # Non-sensitive app settings (override as needed)
  APP_CORS_ALLOWED_ORIGINS: "https://app.example.com"
  # Optional: require a specific Entra ID scope/role (leave empty to authorize via app roles only)
  APP_AZURE_REQUIRED_SCOPE: ""
  # Logging
  LOGGING_LEVEL_COM_EXAMPLE_PLATFORMMANAGEMENT: "INFO"
