# Optional UI deployment (static SPA behind nginx).
# APP_* Entra/API settings are read from the process environment at container start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-management-service-ui
  namespace: platform-management
  labels:
    app.kubernetes.io/name: platform-management-service-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: platform-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-management-service-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-management-service-ui
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: platform-management-service-ui:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-management-service-secrets
                  key: APP_AZURE_TENANT_ID
            - name: APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-management-service-secrets
                  key: APP_CLIENT_ID
            - name: APP_API_SCOPE
              valueFrom:
                secretKeyRef:
                  name: platform-management-service-secrets
                  key: APP_API_SCOPE
            - name: APP_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-management-service-config
                  key: APP_API_BASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: platform-management-service-ui
  namespace: platform-management
  labels:
    app.kubernetes.io/name: platform-management-service-ui
spec:
  selector:
    app.kubernetes.io/name: platform-management-service-ui
  ports:
    - name: http
      port: 80
      targetPort: http
