# Optional UI deployment (static SPA behind nginx).
# Image must be built with VITE_* build-args matching your Entra SPA registration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-management-service-ui
  namespace: platform-management
  labels:
    app.kubernetes.io/name: platform-management-service-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: platform-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-management-service-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-management-service-ui
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: platform-management-service-ui:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: platform-management-service-ui
  namespace: platform-management
  labels:
    app.kubernetes.io/name: platform-management-service-ui
spec:
  selector:
    app.kubernetes.io/name: platform-management-service-ui
  ports:
    - name: http
      port: 80
      targetPort: http
