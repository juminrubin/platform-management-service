# Template secret for Microsoft Entra ID settings (Spring app env vars).
# Prefer creating this via Azure Key Vault CSI / External Secrets / kubectl from CI —
# do not commit real values to git.
#
# Create manually:
#   kubectl create secret generic platform-management-service-secrets \
#     --namespace platform-management \
#     --from-literal=APP_AZURE_TENANT_ID='<tenant-guid>' \
#     --from-literal=APP_API_CLIENT_ID='<api-app-client-id>' \
#     --from-literal=APP_CLIENT_ID='<spa-app-client-id>' \
#     --from-literal=APP_API_SCOPE='api://<api-app-client-id>/access_as_user'
#
# Or apply this file after replacing placeholders (dev only):
apiVersion: v1
kind: Secret
metadata:
  name: platform-management-service-secrets
  namespace: platform-management
  labels:
    app.kubernetes.io/name: platform-management-service
    app.kubernetes.io/component: api
type: Opaque
stringData:
  APP_AZURE_TENANT_ID: "REPLACE_WITH_TENANT_ID"
  APP_API_CLIENT_ID: "REPLACE_WITH_API_APP_CLIENT_ID"
  APP_CLIENT_ID: "REPLACE_WITH_SPA_APP_CLIENT_ID"
  APP_API_SCOPE: "api://REPLACE_WITH_API_APP_CLIENT_ID/access_as_user"
