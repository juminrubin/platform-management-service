# Optional: restrict pod traffic. Requires a CNI that enforces NetworkPolicy
# (Azure CNI with network policies, Calico, Cilium, etc.).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-management-service
  namespace: platform-management
  labels:
    app.kubernetes.io/name: platform-management-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-management-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Ingress controller namespace (adjust labels/namespace to match your cluster)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Microsoft Entra ID / login.microsoftonline.com (JWT JWKS + OIDC discovery)
    # Prefer tightening with IP ranges or an egress proxy in production.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
