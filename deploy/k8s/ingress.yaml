# Example Ingress for AKS.
# Choose ONE controller style:
#   - nginx (Ingress NGINX Controller)
#   - application-gateway (Azure Application Gateway Ingress Controller / AGIC)
#
# Replace host and TLS secret name before apply.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-management-service
  namespace: platform-management
  labels:
    app.kubernetes.io/name: platform-management-service
  annotations:
    # --- Ingress NGINX ---
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Force HTTPS at the edge (uncomment when TLS is configured)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    #
    # --- Azure Application Gateway (AGIC) alternatives ---
    # kubernetes.io/ingress.class: azure/application-gateway
    # appgw.ingress.kubernetes.io/ssl-redirect: "true"
    # appgw.ingress.kubernetes.io/backend-protocol: "http"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - api.example.com
  #     secretName: platform-management-service-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-management-service
                port:
                  number: 80
