# =============================================================================
# Platform Management Service — GitLab CI/CD
# =============================================================================
# Pipeline stages:
#   validate  → compile / static checks
#   test      → unit & integration tests (JUnit reports)
#   package   → container image (Kaniko) → registry
#   security  → image vulnerability scan (Trivy)
#   deploy    → staging (auto on default branch) / production (manual on tags)
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#
#   Azure + AKS (for deploy jobs):
#     AZURE_CLIENT_ID            Service principal / app registration client ID
#     AZURE_CLIENT_SECRET        SP secret (masked, protected)
#     AZURE_TENANT_ID            Entra ID tenant GUID
#     AZURE_SUBSCRIPTION_ID      Azure subscription GUID
#     AKS_RESOURCE_GROUP         Resource group of the AKS cluster
#     AKS_CLUSTER_NAME           AKS cluster name
#
#   App secrets applied to the cluster:
#     APP_AZURE_TENANT_ID        Tenant ID for Entra JWT (application.yml)
#     APP_API_CLIENT_ID          API app registration client ID (JWT audience)
#
#   Optional:
#     ACR_NAME                   If set, also push image to Azure Container Registry
#     ACR_LOGIN_SERVER           e.g. myacr.azurecr.io (auto-detected if ACR_NAME set)
#     KUBE_NAMESPACE             default: platform-management
#     DEPLOY_HOST                Ingress host override for staging/prod
#     SKIP_TRIVY                 "true" to skip security scan
#
# Monorepo layout:
#   backend/   Spring Boot API (Maven)
#   frontend/  React SPA (Vite)
#   deploy/    compose + k8s + deploy scripts
#
# Image destinations:
#   - Always: GitLab Container Registry ($CI_REGISTRY_IMAGE)
#   - Optional: ACR when ACR_NAME is configured
# =============================================================================

workflow:
  rules:
    # Skip pipeline for pure docs/markdown commits on non-default branches
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - validate
  - test
  - package
  - security
  - deploy

variables:
  # --- Maven ---
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Djava.awt.headless=true
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"

  # --- Image ---
  IMAGE_NAME: platform-management-service
  # Immutable tag per commit; also branch/tag aliases in package job
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  GITLAB_IMAGE: $CI_REGISTRY_IMAGE/$IMAGE_NAME

  # --- Kubernetes ---
  KUBE_NAMESPACE: platform-management

  # --- Tools ---
  MAVEN_IMAGE: maven:3.9.11-eclipse-temurin-17
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  KUBECTL_IMAGE: bitnami/kubectl:1.31
  AZURE_CLI_IMAGE: mcr.microsoft.com/azure-cli:2.67.0

default:
  interruptible: true

# -----------------------------------------------------------------------------
# Hidden templates
# -----------------------------------------------------------------------------
.maven:
  image: $MAVEN_IMAGE
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - .m2/repository
    policy: pull-push
  before_script:
    - export MAVEN_OPTS="$MAVEN_OPTS"
    - java -version
    - mvn -version
    - cd backend

.rules_mr_and_branch:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.rules_default_branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rules_tags:
  rules:
    - if: $CI_COMMIT_TAG

.rules_package:
  rules:
    # Build images on default branch, tags, and MRs (MR images not deployed)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# validate
# =============================================================================
validate:compile:
  extends: .maven
  stage: validate
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests compile
  rules:
    - !reference [.rules_mr_and_branch, rules]
    - !reference [.rules_tags, rules]

# =============================================================================
# test
# =============================================================================
test:unit:
  extends: .maven
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
        - backend/target/failsafe-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
      - backend/target/failsafe-reports/
  rules:
    - !reference [.rules_mr_and_branch, rules]
    - !reference [.rules_tags, rules]

# =============================================================================
# package (container image via Kaniko — no privileged Docker-in-Docker)
# =============================================================================
package:image:
  stage: package
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  needs:
    - job: test:unit
      optional: false
  variables:
    # Monorepo: build API image from backend/
    DOCKERFILE_PATH: backend/Dockerfile
    DOCKER_CONTEXT: backend
  before_script:
    - mkdir -p /kaniko/.docker
    # Auth to GitLab Container Registry
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > /kaniko/.docker/config.json
    # Optional: also authenticate to Azure Container Registry
    - |
      if [ -n "${ACR_NAME:-}" ] && [ -n "${AZURE_CLIENT_ID:-}" ]; then
        echo "ACR push enabled for ${ACR_NAME}"
      fi
  script:
    - |
      set -euo pipefail

      DESTINATION_ARGS="--destination=${GITLAB_IMAGE}:${IMAGE_TAG}"
      DESTINATION_ARGS="${DESTINATION_ARGS} --destination=${GITLAB_IMAGE}:${CI_COMMIT_REF_SLUG}"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        DESTINATION_ARGS="${DESTINATION_ARGS} --destination=${GITLAB_IMAGE}:latest"
      fi

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        # v1.2.3 → also tag 1.2.3
        CLEAN_TAG="${CI_COMMIT_TAG#v}"
        DESTINATION_ARGS="${DESTINATION_ARGS} --destination=${GITLAB_IMAGE}:${CLEAN_TAG}"
        DESTINATION_ARGS="${DESTINATION_ARGS} --destination=${GITLAB_IMAGE}:${CI_COMMIT_TAG}"
      fi

      # Optional second registry: ACR (service principal password login for Kaniko)
      if [ -n "${ACR_NAME:-}" ] && [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_CLIENT_SECRET:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ]; then
        ACR_LOGIN_SERVER="${ACR_LOGIN_SERVER:-${ACR_NAME}.azurecr.io}"
        ACR_IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}"
        echo "Also pushing to ACR: ${ACR_IMAGE}"

        # Merge ACR auth into Docker config (SP username = client id, password = secret)
        AUTH="$(printf '%s:%s' "${AZURE_CLIENT_ID}" "${AZURE_CLIENT_SECRET}" | base64 | tr -d '\n')"
        # shellcheck disable=SC2016
        printf '{"auths":{"%s":{"auth":"%s"},"%s":{"username":"%s","password":"%s"}}}\n' \
          "${ACR_LOGIN_SERVER}" "${AUTH}" \
          "${CI_REGISTRY}" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" \
          > /kaniko/.docker/config.json

        DESTINATION_ARGS="${DESTINATION_ARGS} --destination=${ACR_IMAGE}:${IMAGE_TAG}"
        DESTINATION_ARGS="${DESTINATION_ARGS} --destination=${ACR_IMAGE}:${CI_COMMIT_REF_SLUG}"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          DESTINATION_ARGS="${DESTINATION_ARGS} --destination=${ACR_IMAGE}:latest"
        fi
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          CLEAN_TAG="${CI_COMMIT_TAG#v}"
          DESTINATION_ARGS="${DESTINATION_ARGS} --destination=${ACR_IMAGE}:${CLEAN_TAG}"
        fi

        # Export for dotenv artifact (deploy jobs)
        {
          echo "DEPLOY_IMAGE=${ACR_IMAGE}"
          echo "DEPLOY_IMAGE_TAG=${IMAGE_TAG}"
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}"
        } > deploy.env
      else
        {
          echo "DEPLOY_IMAGE=${GITLAB_IMAGE}"
          echo "DEPLOY_IMAGE_TAG=${IMAGE_TAG}"
        } > deploy.env
      fi

      echo "Building and pushing with destinations:"
      echo "${DESTINATION_ARGS}" | tr ' ' '\n'

      # shellcheck disable=SC2086
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/${DOCKER_CONTEXT}" \
        --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE_PATH}" \
        --cache=true \
        --cache-repo="${GITLAB_IMAGE}/cache" \
        --snapshot-mode=redo \
        --compressed-caching=false \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        ${DESTINATION_ARGS}

      echo "Image published:"
      cat deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 30 days
  rules:
    - !reference [.rules_package, rules]

# =============================================================================
# security
# =============================================================================
security:trivy:
  stage: security
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs:
    - job: package:image
      artifacts: true
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - |
      set -euo pipefail
      if [ "${SKIP_TRIVY:-false}" = "true" ]; then
        echo "SKIP_TRIVY=true — skipping scan"
        exit 0
      fi

      IMAGE_REF="${DEPLOY_IMAGE}:${DEPLOY_IMAGE_TAG}"
      echo "Scanning ${IMAGE_REF}"

      # Login for private registries
      if echo "${IMAGE_REF}" | grep -q "${CI_REGISTRY}"; then
        trivy registry login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
      fi

      trivy image \
        --exit-code 0 \
        --severity CRITICAL,HIGH \
        --format table \
        "${IMAGE_REF}"

      # Fail pipeline on CRITICAL (adjust policy as needed)
      trivy image \
        --exit-code 1 \
        --severity CRITICAL \
        --ignore-unfixed \
        --format table \
        "${IMAGE_REF}" | tee trivy-report.txt
  artifacts:
    when: always
    paths:
      - trivy-report.txt
    expire_in: 30 days
  allow_failure:
    exit_codes:
      - 1
  rules:
    - if: $SKIP_TRIVY == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# =============================================================================
# deploy helpers
# =============================================================================
.deploy_base:
  image: $AZURE_CLI_IMAGE
  needs:
    - job: package:image
      artifacts: true
    - job: security:trivy
      optional: true
  before_script:
    - |
      set -euo pipefail

      # Azure login + AKS credentials
      : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID is required}"
      : "${AZURE_CLIENT_SECRET:?AZURE_CLIENT_SECRET is required}"
      : "${AZURE_TENANT_ID:?AZURE_TENANT_ID is required}"
      : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID is required}"
      : "${AKS_RESOURCE_GROUP:?AKS_RESOURCE_GROUP is required}"
      : "${AKS_CLUSTER_NAME:?AKS_CLUSTER_NAME is required}"

      az login --service-principal \
        -u "${AZURE_CLIENT_ID}" \
        -p "${AZURE_CLIENT_SECRET}" \
        --tenant "${AZURE_TENANT_ID}" >/dev/null
      az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      # Install kubectl matching cluster (idempotent)
      if ! command -v kubectl >/dev/null 2>&1; then
        az aks install-cli --only-show-errors
      fi
      kubectl version --client

      az aks get-credentials \
        --resource-group "${AKS_RESOURCE_GROUP}" \
        --name "${AKS_CLUSTER_NAME}" \
        --overwrite-existing \
        --only-show-errors
      kubectl cluster-info
  script:
    - bash deploy/scripts/ci-deploy.sh
  environment:
    # overridden per job
    name: review/$CI_COMMIT_REF_SLUG
  rules:
    - when: never

# =============================================================================
# deploy:staging — auto on default branch
# =============================================================================
deploy:staging:
  extends: .deploy_base
  stage: deploy
  variables:
    DEPLOY_ENV: staging
    # Optional ingress host override
    # DEPLOY_HOST: api-staging.example.com
  environment:
    name: staging
    url: https://api-staging.example.com
    deployment_tier: staging
    kubernetes:
      namespace: $KUBE_NAMESPACE
  resource_group: deploy-$KUBE_NAMESPACE-staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

# =============================================================================
# deploy:production — manual, tags only (v*)
# =============================================================================
deploy:production:
  extends: .deploy_base
  stage: deploy
  variables:
    DEPLOY_ENV: production
    # DEPLOY_HOST: api.example.com
  environment:
    name: production
    url: https://api.example.com
    deployment_tier: production
    kubernetes:
      namespace: $KUBE_NAMESPACE
  resource_group: deploy-$KUBE_NAMESPACE-production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
      when: manual
  allow_failure: false

# =============================================================================
# Optional: stop/review cleanup placeholder (no review apps by default)
# =============================================================================
# Uncomment to deploy ephemeral review environments per MR:
#
# deploy:review:
#   extends: .deploy_base
#   stage: deploy
#   variables:
#     DEPLOY_ENV: review
