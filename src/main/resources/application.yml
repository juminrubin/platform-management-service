spring:
  application:
    name: participant-service-api

  datasource:
    # TIME ZONE=UTC keeps H2 session timestamps in UTC
    url: jdbc:h2:mem:participantdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;TIME ZONE=UTC
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Persist Instant / TIMESTAMP WITH TIME ZONE always as UTC
        jdbc:
          time_zone: UTC
    show-sql: false

  jackson:
    time-zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Application-specific security settings.
# Default: open API for local exploration. Use profile "secure" for Microsoft Entra ID JWT validation.
app:
  security:
    permit-all: true
    required-scope: ${AZURE_REQUIRED_SCOPE:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging is configured in logback-spring.xml (Logback).
# Levels here still work as overrides via Spring Boot's LoggingSystem.
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.example.participantapi: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

---
# Explicit local profile (same as default open mode)
spring:
  config:
    activate:
      on-profile: local

app:
  security:
    permit-all: true

logging:
  level:
    root: DEBUG
    org.springframework.security: DEBUG
