# Profile intended for container / AKS runtime.
# Combined with "secure" for Microsoft Entra ID JWT validation:
#   SPRING_PROFILES_ACTIVE=k8s,secure

server:
  shutdown: graceful
  # Trust X-Forwarded-* from Azure Load Balancer / Ingress
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  h2:
    console:
      enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Patterns and appenders come from logback-spring.xml (profile "k8s")
logging:
  level:
    root: INFO
    com.example.participantapi: INFO
    org.springframework.security: WARN
