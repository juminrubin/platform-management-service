# Template secret for Microsoft Entra ID settings.
# Prefer creating this via Azure Key Vault CSI / External Secrets / kubectl from CI —
# do not commit real values to git.
#
# Create manually:
#   kubectl create secret generic participant-service-api-secrets \
#     --namespace participant-api \
#     --from-literal=AZURE_TENANT_ID='<tenant-guid>' \
#     --from-literal=AZURE_API_CLIENT_ID='<api-app-client-id>'
#
# Or apply this file after replacing placeholders (dev only):
apiVersion: v1
kind: Secret
metadata:
  name: participant-service-api-secrets
  namespace: participant-api
  labels:
    app.kubernetes.io/name: participant-service-api
    app.kubernetes.io/component: api
type: Opaque
stringData:
  AZURE_TENANT_ID: "REPLACE_WITH_TENANT_ID"
  AZURE_API_CLIENT_ID: "REPLACE_WITH_API_APP_CLIENT_ID"
