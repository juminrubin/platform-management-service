apiVersion: v1
kind: ConfigMap
metadata:
  name: participant-service-api-config
  namespace: participant-api
  labels:
    app.kubernetes.io/name: participant-service-api
    app.kubernetes.io/component: api
data:
  SPRING_PROFILES_ACTIVE: "k8s,secure"
  SERVER_PORT: "8080"
  # Non-sensitive app settings (override as needed)
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
  # Optional: require a specific Entra ID scope/role (leave empty to accept any valid JWT)
  AZURE_REQUIRED_SCOPE: ""
  # Logging
  LOGGING_LEVEL_COM_EXAMPLE_PARTICIPANTAPI: "INFO"
