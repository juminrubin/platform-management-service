apiVersion: apps/v1
kind: Deployment
metadata:
  name: participant-service-api
  namespace: participant-api
  labels:
    app.kubernetes.io/name: participant-service-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: participant-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: participant-service-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: participant-service-api
        app.kubernetes.io/component: api
      annotations:
        # Force pod restart when config/secret content changes (optional helper annotation)
        checksum/config: "replace-via-ci-or-kustomize"
    spec:
      serviceAccountName: participant-service-api
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with your ACR image, e.g. myacr.azurecr.io/participant-service-api:1.0.0
          image: participant-service-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: participant-service-api-config
            - secretRef:
                name: participant-service-api-secrets
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Spring Boot 3 actuator probes (enabled in application-k8s.yml)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # Writable tmp for JVM / Spring (readOnlyRootFilesystem=true)
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Uncomment when pulling from a private ACR without AKS→ACR attachment:
      # imagePullSecrets:
      #   - name: acr-pull-secret
