# Test profile: no live Entra discovery; open security for unit/persistence tests.
# Security integration tests override app.security.permit-all=false and import TestJwtDecoderConfig.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;TIME ZONE=UTC
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Do not contact login.microsoftonline.com during tests.
  # Override Entra placeholders from application.yml so the context loads without Azure env vars.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
          audiences: test-audience

  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration

app:
  security:
    # Unit / @DataJpaTest slices: no JWT required.
    # Role-based security tests set permit-all=false via @TestPropertySource.
    permit-all: true
  consumption-import:
    # Keep Azure blob polling off in tests (unit tests exercise the service with mocks).
    enabled: false

logging:
  level:
    root: WARN
    org.jrtech.platformmanagement: DEBUG
