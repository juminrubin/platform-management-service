# Test profile: in-memory store, open security for unit/persistence tests.
# Security integration tests override app.security.permit-all=false and import TestJwtDecoderConfig.
spring:
  jackson:
    time-zone: UTC

  # Do not contact login.microsoftonline.com during tests.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
          audiences: test-audience

  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration

app:
  security:
    permit-all: true
  azure-table:
    enabled: false
  entitlement-check-cache:
    enabled: true
    load-on-startup: false
    scheduled-refresh-enabled: false
  azure:
    credential:
      client-id: ""
      client-secret: ""
      tenant-id: ""
  entra-directory:
    enabled: false
    auto-start: false
    refresh-interval-ms: 0
  consumption-import:
    enabled: false
  connectors:
    datasource-loading:
      enabled: true
      auto-start: true
      refresh-interval-ms: 3600000
    consumption-eventhub:
      enabled: false
      auto-start: false
    consumption-blob:
      enabled: false
      runner-enabled: false
      storage-account-url: ""
      container: ""
      blob-prefixes: []
      blob-prefix: ""
      require-source-ref-id: true

logging:
  level:
    root: WARN
    org.jrtech.platformmanagement: DEBUG
