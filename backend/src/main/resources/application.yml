# Platform Management Service — always secured with Microsoft Entra ID (Azure AD) JWTs.
#
# Required environment:
#   APP_AZURE_TENANT_ID       Entra directory (tenant) GUID
#   APP_API_CLIENT_ID   API app registration application (client) ID
#
# Optional:
#   APP_REQUIRED_SCOPE  Extra filter-layer gate (e.g. access_as_user); leave empty to
#                             authorize only via app roles (System.Maintainer, …)
#   APP_CORS_ALLOWED_ORIGINS  Comma-separated browser origins
#   app.security.group-role-mappings / application-registrations — map Entra groups
#     and OAuth scopes from Application Registration IDs (see comments near app.security)
#   APP_ENTRA_DIRECTORY_ENABLED=true — load members of groups named Platform-System-* via Graph
#   Azure credential (shared by Graph / Blob / Event Hub / Table) — inferred from fields:
#     client-id  ← APP_UAMI_CLIENT_ID or AZURE_CLIENT_ID
#     1. client-id + AZURE_CLIENT_SECRET → service principal (username + password)
#     2. client-id only → UAMI
#     3. otherwise → SAMI
#     AZURE_TENANT_ID required for service principal
#   Catalog persistence: Azure Table Storage (app.azure-table) or process-local in-memory
#   when APP_AZURE_TABLE_ENABLED=false (default for local/dev).
#
# Run:
#   export APP_AZURE_TENANT_ID=...
#   export APP_API_CLIENT_ID=...
#   mvn spring-boot:run
#
# Tokens: scripts/get-token-human.sh | scripts/get-token-mi.sh
# Call with: Authorization: Bearer <access_token>

spring:
  application:
    name: platform-management-service

  jackson:
    time-zone: UTC

  # No JDBC datasource — catalog/consumption use Azure Table or in-memory store
  autoconfigure:
    exclude: []

  security:
    oauth2:
      resourceserver:
        jwt:
          # OpenID metadata: validates issuer + loads signing keys from Entra
          issuer-uri: https://login.microsoftonline.com/${APP_AZURE_TENANT_ID}/v2.0
          # Entra may issue aud as the bare client id or as api://<client-id>
          audiences:
            - ${APP_API_CLIENT_ID}
            - api://${APP_API_CLIENT_ID}
            - ${APP_REQUIRED_SCOPE}

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    # Expose Maven-stamped META-INF/build-info.properties (version + time) on /actuator/info
    build:
      enabled: true
    env:
      enabled: false

# OpenAPI 3 / Swagger UI (springdoc-openapi)
# Canonical UI entries (all work):
#   http://localhost:8080/swagger-ui.html      (springdoc default welcome → index)
#   http://localhost:8080/swagger-ui/          (redirect → index; see SwaggerUiRedirectConfig)
#   http://localhost:8080/swagger-ui/index.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
# Disable with APP_SWAGGER_ENABLED=false (e.g. locked-down production)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${APP_SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${APP_SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    # Remember the Bearer token in the browser across reloads (docs stay public)
    persist-authorization: true
    # Do not auto-prompt for credentials just to open the UI
    disable-swagger-default-url: true
  show-actuator: false
  # Scan only our REST controllers (security scheme still applies to these operations)
  packages-to-scan: org.jrtech.platformmanagement.controller
  paths-to-match: /api/**

# App roles (JWT "roles" claim) drive @PreAuthorize — see security/AppRoles.kt
#   System.Maintainer | System.Reader | Entitlement.Reader | Consumption.Registrator
#
# Optional Entra security group → app role mapping (JWT "groups" claim):
#   APP_AZURE_GROUP_ROLE_MAPPINGS JSON, e.g.
#     {"11111111-2222-3333-4444-555555555555":["System.Maintainer"]}
# Prefer assigning app roles to groups in Entra; use this only when tokens carry
# groups without resolved roles.
#
# Optional per Application Registration ID mappings (scopes + group→roles):
#   app.security.application-registrations[0].client-id: <app registration client id>
#   app.security.application-registrations[0].oauth-scopes: access_as_user
#   app.security.application-registrations[0].group-role-mappings: { <group-oid>: [System.Reader] }
app:
  security:
    # Always require Entra JWT + roles (never open the API)
    permit-all: false
    # Optional extra gate: SCOPE_<name> or ROLE_<name> on /api/** except /api/v1/auth/**
    # (auth/me stays open to any authenticated JWT).
    required-scope: ${APP_REQUIRED_SCOPE:}
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # Global group object-id → app role values (defaults to empty; omit if unused).
    # Example (uncomment and replace GUIDs):
    # group-role-mappings:
    #   "11111111-2222-3333-4444-555555555555":
    #     - System.Maintainer
    #   "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee":
    #     - System.Reader
    #
    # Per Application Registration (client) ID: expected OAuth scopes + group→role map.
    # Matched against token azp / appid / aud. Defaults include the API app registration
    # with the common delegated scope when APP_API_CLIENT_ID is set.
    application-registrations:
      - client-id: ${APP_API_CLIENT_ID:}
        oauth-scopes:
          - access_as_user
          - api://${APP_API_CLIENT_ID:}/access_as_user

        # group-role-mappings:
        #   "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee":
        #     - System.Maintainer

  # Durable catalog store: Azure Table Storage. When disabled, uses process-local memory
  # (fine for single-node local/dev; multi-instance production should enable Table).
  # Catalog seed is external (scripts) — the app does not load datasource.json.
  azure-table:
    enabled: ${APP_AZURE_TABLE_ENABLED:false}
    endpoint: ${APP_AZURE_TABLE_ENDPOINT:}
    connection-string: ${APP_AZURE_TABLE_CONNECTION_STRING:}
    table-prefix: ${APP_AZURE_TABLE_PREFIX:pms}
    create-tables-if-not-exist: ${APP_AZURE_TABLE_CREATE:true}

  # In-memory concurrent maps for GET /api/v1/entitlements/check.
  # Lifecycle owned by connector datasource-loading (not independent schedule).
  entitlement-check-cache:
    enabled: ${APP_ENTITLEMENT_CHECK_CACHE_ENABLED:true}
    load-on-startup: false
    scheduled-refresh-enabled: false
    refresh-interval-ms: ${APP_ENTITLEMENT_CHECK_CACHE_REFRESH_MS:3600000}

  # Microsoft Entra directory: load members of groups named Platform-System-* via Graph
  # into a thread-safe ConcurrentHashMap (groupId → members).
  # Lifecycle via connector entra-directory:
  #   auto-start=true → arm on boot (immediate load for human auth + fixed-delay refresh)
  #   POST /api/v1/connectors/entra-directory/start|stop → arm/disarm schedule
  #   stop never cancels an in-flight Graph load; cache retained for authorization
  # Human users (email/UPN) are authorized by membership; group display names map to app roles:
  #   Platform-System-Maintainer → System.Maintainer
  #   Platform-System-Reader → System.Reader
  #   Platform-System-Entitlement-Reader → Entitlement.Reader
  #   Platform-System-Consumption-Registrator → Consumption.Registrator
  # Requires Graph application permissions (admin consent) on the credential principal:
  #   Group.Read.All + GroupMember.Read.All + User.Read.All
  #   (or Directory.Read.All alone — covers user profile attributes on members)
  # Members are loaded via /members/microsoft.graph.user and may hydrate via GET /users/{id}.
  # Auth: app.azure.credential (UAMI → service principal → SAMI).
  entra-directory:
    enabled: ${APP_ENTRA_DIRECTORY_ENABLED:true}
    group-name-prefix: ${APP_ENTRA_GROUP_NAME_PREFIX:Platform-System-}
    include-transitive-members: ${APP_ENTRA_INCLUDE_TRANSITIVE_MEMBERS:false}
    # Default 900000 ms = 15 minutes (while connector running)
    refresh-interval-ms: ${APP_ENTRA_DIRECTORY_REFRESH_MS:900000}
    # Arm connector on boot (initial load + schedule). Prefer true so auth has a warm cache.
    auto-start: ${APP_ENTRA_DIRECTORY_AUTO_START:true}
    graph-base-url: ${APP_ENTRA_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}

  # Shared Azure TokenCredential (Graph, Blob, Event Hub).
  # client-id is shared: APP_UAMI_CLIENT_ID (UAMI) or AZURE_CLIENT_ID (SP / WI UAMI).
  # Mode: client-id+secret → SP; client-id only → UAMI; else → SAMI.
  azure:
    credential:
      client-id: ${AZURE_CLIENT_ID:${APP_UAMI_CLIENT_ID:}}
      client-secret: ${AZURE_CLIENT_SECRET:}
      tenant-id: ${AZURE_TENANT_ID:}

  # Background import of consumption Avro files from Azure Blob Storage (legacy keys).
  # Prefer app.connectors.consumption-blob.* going forward (see design doc).
  # Auth: app.azure.credential (UAMI/SP/SAMI); connection string optional for local only.
  consumption-import:
    enabled: ${APP_CONSUMPTION_IMPORT_ENABLED:false}
    connection-string: ${APP_AZURE_STORAGE_CONNECTION_STRING:}
    account-url: ${APP_AZURE_STORAGE_ACCOUNT_URL:}
    container-name: ${APP_CONSUMPTION_IMPORT_CONTAINER:consumption}
    blob-prefix: ${APP_CONSUMPTION_IMPORT_PREFIX:}
    poll-interval-ms: ${APP_CONSUMPTION_IMPORT_POLL_MS:300000}
    max-blobs-per-run: ${APP_CONSUMPTION_IMPORT_MAX_BLOBS:20}
    require-avro-extension: true

  # Connectors (integrations). Defaults off; Blob/EH use app.azure.credential in production.
  # Unified control plane (System.Maintainer):
  #   GET  /api/v1/connectors
  #   GET  /api/v1/connectors/{id}           # runtime info + log snapshot (≤32KB)
  #   GET|PUT /api/v1/connectors/{id}/config
  #   POST /api/v1/connectors/{id}/start|stop
  # ids: datasource-loading | consumption-storage | consumption-eventhub | entra-directory
  # Data plane (not under /connectors):
  #   entra-directory → /api/v1/entra/groups|members
  #   consumption-storage → /api/v1/consumption/blob (+ domain /api/v1/consumptions)
  #   consumption-eventhub → /api/v1/consumptions
  connectors:
    # Rebuilds entitlement check cache from durable store (hourly by default).
    # Does not seed catalog data — populate Table via external scripts.
    # Control: POST /api/v1/connectors/datasource-loading/start|stop
    # Manual cache: POST /api/v1/entitlements/cache/refresh
    datasource-loading:
      enabled: ${APP_CONNECTOR_DATASOURCE_ENABLED:true}
      auto-start: ${APP_CONNECTOR_DATASOURCE_AUTO_START:true}
      refresh-interval-ms: ${APP_CONNECTOR_DATASOURCE_REFRESH_MS:3600000}
    consumption-eventhub:
      enabled: ${APP_CONNECTOR_EH_ENABLED:false}
      # When true and enabled, start on ApplicationReady; prefer false and use Maintainer API.
      auto-start: ${APP_CONNECTOR_EH_AUTO_START:false}
      fully-qualified-namespace: ${APP_CONNECTOR_EH_NAMESPACE:}
      event-hub-name: ${APP_CONNECTOR_EH_NAME:}
      consumer-group: ${APP_CONNECTOR_EH_CONSUMER_GROUP:$Default}
      checkpoint-storage-account-url: ${APP_CONNECTOR_EH_CHECKPOINT_ACCOUNT_URL:}
      checkpoint-container: ${APP_CONNECTOR_EH_CHECKPOINT_CONTAINER:eh-checkpoints}
      require-source-ref-id: ${APP_CONNECTOR_EH_REQUIRE_SOURCE_REF_ID:true}
      poison-skip-after: ${APP_CONNECTOR_EH_POISON_SKIP_AFTER:5}
    # Hierarchical Avro: {blob-prefix}/yyyy/MM/dd/HH_mm_ss.avro (multiple prefixes supported)
    # GET /api/v1/connectors/consumption-storage?startDate=&endDate=
    consumption-blob:
      enabled: ${APP_CONNECTOR_BLOB_ENABLED:false}
      runner-enabled: ${APP_CONNECTOR_BLOB_RUNNER_ENABLED:false}
      storage-account-url: ${APP_CONNECTOR_BLOB_ACCOUNT_URL:}
      # Optional local-only override; prefer TokenCredential + storage-account-url in prod
      connection-string: ${APP_CONNECTOR_BLOB_CONNECTION_STRING:${APP_AZURE_STORAGE_CONNECTION_STRING:}}
      container: ${APP_CONNECTOR_BLOB_CONTAINER:}
      # Prefer list form (YAML) or APP_CONNECTOR_BLOB_PREFIXES_0 / _1 / …
      # blob-prefixes:
      #   - eh-capture
      #   - manual/import
      blob-prefixes: []
      # Singular or comma-separated (merged with blob-prefixes); e.g. "a,b" or APP_CONNECTOR_BLOB_PREFIX
      blob-prefix: ${APP_CONNECTOR_BLOB_PREFIX:}
      max-range-days: ${APP_CONNECTOR_BLOB_MAX_RANGE_DAYS:31}
      max-blobs-per-job: ${APP_CONNECTOR_BLOB_MAX_BLOBS:500}
      require-source-ref-id: ${APP_CONNECTOR_BLOB_REQUIRE_SOURCE_REF_ID:true}

# Logging is configured in logback-spring.xml (Logback).
# Levels here still work as overrides via Spring Boot's LoggingSystem.
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    org.jrtech.platformmanagement: DEBUG
    org.springframework.security: INFO
---
# Local/debug profile: same security, more verbose logs (still requires Entra JWT)
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: DEBUG
    org.springframework.security: DEBUG
